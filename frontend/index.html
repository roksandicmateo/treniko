<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Icons. Every file referenced here exists in public/ — the previous
         favicon.ico and apple-touch-icon.png links did not, so both requests
         fell through to the SPA and returned an HTML document with a 200. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />

    <title>TRENIKO — Training Management Software for Personal Trainers</title>
    <meta
      name="description"
      content="TRENIKO keeps your clients, sessions, packages and payments in one place. Training management software for independent personal trainers."
    />
    <link rel="canonical" href="https://treniko.com/" />

    <!-- Indexable by default, because the document served at `/` is now a public
         landing page. The private routes share this same file, so they are
         switched to `noindex, nofollow` at runtime by src/seo/RouteMeta.jsx and
         disallowed outright in public/robots.txt for crawlers that do not run
         JavaScript. Change all three together or they will disagree. -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph — the preview every Instagram, Facebook and WhatsApp share of
         treniko.com renders. og:image must be an absolute URL; scrapers do not
         resolve relative paths. -->
    <meta property="og:site_name" content="TRENIKO" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://treniko.com/" />
    <meta property="og:title" content="TRENIKO — Training Management Software for Personal Trainers" />
    <meta
      property="og:description"
      content="Keep your clients, sessions, packages and payments in one place. Built for independent personal trainers."
    />
    <meta property="og:image" content="https://treniko.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TRENIKO — run your coaching business, not your spreadsheets." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRENIKO — Training Management Software for Personal Trainers" />
    <meta
      name="twitter:description"
      content="Keep your clients, sessions, packages and payments in one place. Built for independent personal trainers."
    />
    <meta name="twitter:image" content="https://treniko.com/og-image.png" />
    <meta name="twitter:image:alt" content="TRENIKO — run your coaching business, not your spreadsheets." />

    <!-- Structured data.
         Two types only, and both are things that can be checked against the
         product rather than asserted about it:

           SoftwareApplication — what this is, who it is for, what it costs.
           Organization        — who publishes it, and where else it exists.

         There is deliberately NO aggregateRating and NO review. TRENIKO has
         almost no customers yet, so any rating here would be invented, and
         invented review markup is both a lie to the reader and a manual action
         from Google. Add it when there is something real to cite, and not
         before.

         `price: 0` is not marketing. There is no payment processor anywhere in
         the product, so zero is the only price that can currently be charged —
         the same fact the pricing section on the page states in words. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "@id": "https://treniko.com/#software",
          "name": "TRENIKO",
          "applicationCategory": "BusinessApplication",
          "applicationSubCategory": "Training management software for personal trainers",
          "operatingSystem": "Web browser",
          "url": "https://treniko.com/",
          "description": "TRENIKO keeps clients, sessions, packages, payments, progress and training plans for independent personal trainers in one workspace, instead of spread across a phone, a calendar and a spreadsheet.",
          "inLanguage": ["en", "hr", "de"],
          "publisher": { "@id": "https://treniko.com/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "EUR",
            "availability": "https://schema.org/InStock",
            "description": "Free plan: up to 5 clients and 20 sessions a month. No credit card required."
          },
          "featureList": [
            "Client records with goals, private notes and full history",
            "One-to-one and group session scheduling",
            "Session packages that count down automatically, with low-balance alerts",
            "Payment records with amount, method and paid or pending status",
            "Progress measurements tracked over time",
            "Training plans built from an exercise library and saved as templates",
            "Data export and account deletion"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://treniko.com/#website",
          "url": "https://treniko.com/",
          "name": "TRENIKO",
          "description": "Training management software for independent personal trainers.",
          "inLanguage": "en",
          "publisher": { "@id": "https://treniko.com/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://treniko.com/#organization",
          "name": "TRENIKO",
          "url": "https://treniko.com/",
          "logo": "https://treniko.com/og-image.png",
          "email": "info@treniko.com",
          "sameAs": [
            "https://www.instagram.com/treniko_fitness/",
            "https://www.facebook.com/profile.php?id=61593112186107"
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
