# TRENIKO — security headers for everything nginx serves from disk.
#
# ── Why this is a snippet and not a server-level block ───────────────────────
# Two reasons, and both are load-bearing.
#
# 1. nginx `add_header` does NOT inherit into a location that has its own
#    `add_header`. Three locations here already set Cache-Control, so headers
#    declared at server level would silently vanish from exactly the responses
#    that matter most — index.html and app.html. Including the snippet inside
#    each location is the only form that actually applies everywhere.
#
# 2. `location /api` must NOT get these. The Express app already sets a full
#    helmet header set on every API response, including HSTS, a stricter
#    `X-Frame-Options: DENY` and its own tight CSP. Adding a second copy from
#    nginx would emit duplicate headers, and where the two disagree —
#    SAMEORIGIN here against DENY there — the result is ambiguous rather than
#    merely redundant. The API defends itself; this file covers the static side
#    it does not touch.
#
# Deliberately excluded from every location: /api.

# The application takes passwords. Without HSTS a first visit typed as
# http:// is interceptable before the 301 to https runs.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Kept alongside CSP frame-ancestors below for browsers that honour only this.
# SAMEORIGIN, not DENY, because the two must not contradict each other.
add_header X-Frame-Options "SAMEORIGIN" always;

# Nothing in TRENIKO uses any of these. Denying them costs nothing and removes
# them from the attack surface of any script that ever does run here.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
