# TRENIKO — Content-Security-Policy for the static side.
#
# Separate from treniko-security.conf so that switching between Report-Only and
# enforcing is a one-line edit in one file, rather than a search across the site
# config. /api is excluded here too: helmet already sends a far stricter policy
# (`default-src none`) on API responses, which is correct for JSON and would
# break the HTML if applied to it.
#
# ── Why each directive is what it is ─────────────────────────────────────────
#
# script-src self   — no hashes, no nonces, no unsafe-inline. The content
#                       pages used to carry an inline beacon; it was moved to
#                       /assets-static/beacon.<hash>.js precisely so this line
#                       could stay this short. The <script type="application/
#                       ld+json"> blocks are data, not executable, and are not
#                       covered by script-src.
#
# style-src  unsafe-inline — genuinely required, and worth being honest about.
#                       React writes inline style attributes during render, and
#                       a statically built bundle has no server to mint a nonce
#                       per response. Removing it would need either a nonce at
#                       request time or the elimination of every inline style in
#                       the application. Until one of those happens, this is the
#                       one weak directive in the policy.
#
# img-src    data:    — SVG favicon and any inline icon.
#            blob:    — the account-export flow builds a blob URL client-side.
#
# connect-src self  — VITE_API_URL is https://treniko.com/api in the
#                       production build, so the API is same-origin. Verified,
#                       not assumed: the deployed bundle contains that string.
#
# frame-ancestors self — matches X-Frame-Options: SAMEORIGIN in the other
#                       snippet. The two must agree.
#
# No report-uri: collecting reports needs an endpoint to receive them, and an
# unauthenticated one is a free way to fill a disk. Violations are checked in a
# browser console instead, on every page type, before this is enforced.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; media-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;
