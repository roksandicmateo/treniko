server {
    server_name treniko.com www.treniko.com;

    # Canonical host. Without this, https://www.treniko.com answered 200 with
    # the same bytes as the apex — two hosts serving identical content. The
    # canonical tag already pointed at the apex; this makes it unambiguous.
    if ($host = www.treniko.com) {
        return 301 https://treniko.com$request_uri;
    }

    root /var/www/treniko/frontend/dist;
    index index.html;

    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Content-hashed build output. The filename changes whenever the bytes do,
    # so these can be cached hard and never revalidated.
    location ^~ /assets/ {
        include snippets/treniko-security.conf;
        include snippets/treniko-csp.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA shell must NOT be cached, and this is not a performance nicety.
    # index.html names the hashed bundles; a stale copy points at asset files
    # that the next deploy deletes, and the visitor gets a blank page with a
    # 404 in the console until they hard-refresh. must-revalidate makes the
    # browser check every time, which costs one conditional request.
    location = /index.html {
        include snippets/treniko-security.conf;
        include snippets/treniko-csp.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Same reasoning as index.html: this shell names the hashed bundles, and a
    # stale copy points at asset files the next deploy deletes.
    location = /app.html {
        include snippets/treniko-security.conf;
        include snippets/treniko-csp.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Content-hashed static assets for the guide pages: content.<hash>.css and
    # beacon.<hash>.js, emitted by frontend/scripts/generate-content-pages.mjs.
    # The name changes whenever the bytes do, so these can be cached hard.
    #
    # This must sit ABOVE the generic extension location below: nginx takes the
    # FIRST matching regex location, not the best one.
    #
    # It exists because without an explicit Cache-Control, Cloudflare applies
    # its own default TTL by file extension — four hours for CSS. That is how a
    # deployed stylesheet change stayed invisible for four hours in production
    # on 25 Aug, and how these very security headers were briefly absent from
    # already-cached asset responses.
    # Quoted: nginx parses an unquoted `{` in a location regex as the start of a
    # block, so `{10}` ends the directive mid-pattern. `nginx -t` catches it.
    location ~ "^/assets-static/[a-z]+\.[0-9a-f]{10}\.(css|js)$" {
        include snippets/treniko-security.conf;
        include snippets/treniko-csp.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The free tracker template. Not content-hashed — the filename is the thing
    # people link to and share, so it has to stay stable. One hour keeps a
    # corrected template from being served from an edge cache for a day.
    location ^~ /downloads/ {
        include snippets/treniko-security.conf;
        include snippets/treniko-csp.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Anything with a file extension is a request for a file. Serve it or 404 —
    # never the SPA shell. See the note above.
    location ~ \.[A-Za-z0-9]+$ {
        include snippets/treniko-security.conf;
        include snippets/treniko-csp.conf;
        try_files $uri =404;
    }

    location / {
        include snippets/treniko-security.conf;
        include snippets/treniko-csp.conf;
        # $uri/index.html BEFORE $uri/ is deliberate.
        #
        # The static content pages live at /guides/client-management/index.html.
        # With only `$uri/`, nginx resolves the directory and then issues a 301
        # to append a trailing slash — so /guides answered 301 -> /guides/ while
        # the page itself declared a canonical of /guides. A canonical pointing
        # at a URL that redirects is self-contradictory and makes Google pick
        # the target for us.
        #
        # Serving $uri/index.html directly returns 200 at the clean URL, which
        # is the one in the canonical tag, the sitemap and every internal link.
        # Fallback is app.html, NOT index.html.
        #
        # index.html now carries the prerendered homepage (see
        # frontend/scripts/prerender.mjs). If it were still the SPA fallback,
        # /login would arrive with landing-page markup already in #root, React
        # would try to hydrate a login form onto it, and every private route
        # would begin with a hydration mismatch and a flash of the wrong page.
        #
        # app.html is the untouched shell. `/` never reaches this line: it is
        # resolved by the `index index.html` directive above.
        try_files $uri $uri/index.html $uri/ /app.html;

        # Every response this location produces is HTML: the prerendered
        # homepage, a generated content page, or the app shell. None of it may
        # be cached without revalidation, and `location = /index.html` above
        # does NOT cover the homepage — `try_files` serves a matched file inside
        # the current location, without a second location lookup, so `/` was
        # going out with no Cache-Control at all and picking up whatever
        # heuristic the browser and Cloudflare chose.
        #
        # That is the failure the note above warns about: index.html names the
        # content-hashed bundles, and a stale copy points at asset files the
        # next deploy has already deleted. The visitor gets a blank page and a
        # 404 in the console until they hard-refresh.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/treniko.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/treniko.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.treniko.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = treniko.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name treniko.com www.treniko.com;
    return 404; # managed by Certbot




}